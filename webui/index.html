<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>sbctl - Provider 管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #f5f5f5; color: #333; line-height: 1.5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  nav { background: #fff; border-bottom: 1px solid #ddd; padding: 0.6rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
  nav .brand { font-weight: 700; color: #007bff; margin-right: 1rem; }
  nav a { color: #555; text-decoration: none; padding: 0.3rem 0.2rem; }
  nav a.active { color: #007bff; border-bottom: 2px solid #007bff; }
  main { flex: 1; display: flex; overflow: hidden; }
  aside { width: 260px; border-right: 1px solid #ddd; background: #fff; padding: 1rem; overflow-y: auto; }
  aside h2 { font-size: 0.95rem; margin-bottom: 0.8rem; color: #666; }
  aside .field { display: flex; flex-direction: column; margin-bottom: 0.8rem; }
  aside label { font-size: 0.85rem; margin-bottom: 4px; color: #555; }
  aside input, aside select { padding: 0.45rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
  aside button { padding: 0.5rem 0.9rem; border: none; border-radius: 6px; background: #007bff; color: #fff; cursor: pointer; width: 100%; }
  .content { flex: 1; padding: 1.2rem; overflow-y: auto; }
  .content h1 { font-size: 1.2rem; margin-bottom: 1rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; font-size: 0.9rem; }
  th { background: #f5f5f5; }
  .msg { color: #999; font-size: 0.82rem; word-break: break-all; }
  .error { color: #c00; margin: 0.5rem 0; white-space: pre-wrap; font-size: 0.9rem; }
  .actions button { margin-right: 0.3rem; padding: 0.3rem 0.7rem; border: none; border-radius: 5px; cursor: pointer; background: #007bff; color: #fff; font-size: 0.85rem; }
  .actions .btn-fetch { background: #28a745; }
  .actions .btn-del { background: #dc3545; }
</style>
</head>
<body>
<nav>
  <span class="brand">sbctl</span>
  <a href="/" class="active">Provider 管理</a>
  <a href="/templates">模板管理</a>
  <a href="/url">生成 URL</a>
</nav>

<main>
  <aside>
    <h2 id="form-title">添加 Provider</h2>
    <form id="add-form">
      <div class="field">
        <label>名称</label>
        <input id="f-name" placeholder="机场名称" required>
      </div>
      <div class="field">
        <label>来源</label>
        <select id="f-source">
          <option value="url">url</option>
          <option value="upload">upload</option>
        </select>
      </div>
      <div class="field" id="url-field">
        <label>订阅 URL（http/https）</label>
        <input id="f-url" placeholder="https://...">
      </div>
      <div class="field" id="file-field" style="display:none">
        <label>上传配置文件</label>
        <input id="f-file" type="file">
      </div>
      <div class="field">
        <label>更新提示（可选）</label>
        <input id="f-message" placeholder="如：需去官网获取订阅码">
      </div>
      <button type="submit">添加</button>
    </form>
  </aside>

  <div class="content">
    <h1>Provider 列表</h1>
    <div class="error" id="error"></div>
    <table>
      <thead>
        <tr>
          <th>名称</th>
          <th>URL</th>
          <th>来源</th>
          <th>提示</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="providers"></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const errorBox = $('error');

function showError(msg) { errorBox.textContent = msg || ''; }

async function api(url, options) {
  const resp = await fetch(url, options);
  const text = await resp.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!resp.ok) {
    throw new Error(data && data.error ? data.error : ('HTTP ' + resp.status));
  }
  return data;
}

async function load() {
  try {
    const list = await api('/api/providers');
    const tbody = $('providers');
    tbody.innerHTML = '';
    for (const p of list) {
      const tr = document.createElement('tr');
      const isUpload = p.source === 'upload';
      tr.innerHTML = `
        <td>${escapeHtml(p.name)}</td>
        <td class="msg">${escapeHtml(isUpload ? (p.file_name || '') : (p.url || ''))}</td>
        <td>${escapeHtml(p.source)}</td>
        <td class="msg">${escapeHtml(p.message || '')}</td>
        <td class="actions">
          <button data-act="edit">编辑</button>
          <button data-act="${isUpload ? 'upload' : 'update'}" class="btn-fetch">${isUpload ? '上传' : '更新'}</button>
          <button data-act="delete" class="btn-del">删除</button>
        </td>`;
      tr.querySelector('[data-act="edit"]').onclick = () => fillForm(p);
      if (isUpload) {
        tr.querySelector('[data-act="upload"]').onclick = () => uploadSub(p);
      } else {
        tr.querySelector('[data-act="update"]').onclick = () => fetchSub(p);
      }
      tr.querySelector('[data-act="delete"]').onclick = () => del(p);
      tbody.appendChild(tr);
    }
    showError('');
  } catch (e) {
    showError('加载列表失败: ' + e.message);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

let editingUuid = null;

function updateSourceUI() {
  const src = $('f-source').value;
  $('url-field').style.display = src === 'url' ? '' : 'none';
  $('file-field').style.display = src === 'upload' ? '' : 'none';
  if (src === 'upload') $('f-url').value = '';
}
$('f-source').onchange = updateSourceUI;

function fillForm(p) {
  editingUuid = p.uuid;
  $('f-name').value = p.name;
  $('f-url').value = p.url || '';
  $('f-source').value = p.source || 'url';
  $('f-message').value = p.message || '';
  $('f-file').value = '';
  $('form-title').textContent = '编辑 Provider';
  updateSourceUI();
  document.querySelector('form button').textContent = '保存修改';
}

async function uploadFile(uuid) {
  const fileInput = $('f-file');
  if (!fileInput.files.length) return;
  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  await api('/api/providers/' + uuid + '/upload', {method: 'POST', body: fd});
}

$('add-form').onsubmit = async (e) => {
  e.preventDefault();
  const source = $('f-source').value;
  const url = $('f-url').value.trim();
  if (source === 'url') {
    if (!url) { showError('请填写订阅 URL'); return; }
    if (!/^https?:\/\//i.test(url)) { showError('URL 必须是 http(s) 地址'); return; }
  }
  const body = {
    name: $('f-name').value,
    url: url,
    source: source,
    message: $('f-message').value,
  };
  try {
    if (editingUuid) {
      await api('/api/providers/' + editingUuid, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      await uploadFile(editingUuid);
    } else {
      const list = await api('/api/providers', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const created = list[list.length - 1];
      await uploadFile(created.uuid);
    }
    editingUuid = null;
    $('add-form').reset();
    $('form-title').textContent = '添加 Provider';
    document.querySelector('form button').textContent = '添加';
    updateSourceUI();
    load();
  } catch (err) {
    showError('保存失败: ' + err.message);
  }
};

async function del(p) {
  if (!confirm('删除 provider ' + p.name + '？')) return;
  try {
    await api('/api/providers/' + p.uuid, {method: 'DELETE'});
    load();
  } catch (err) {
    showError('删除失败: ' + err.message);
  }
}

async function fetchSub(p) {
  if (!confirm('更新 ' + p.name + ' 的订阅？')) return;
  try {
    const data = await api('/api/providers/' + p.uuid + '/fetch', {method: 'POST'});
    showError('更新成功: ' + data.bytes + ' bytes');
  } catch (err) {
    showError('更新失败: ' + err.message);
  }
}

function uploadSub(p) {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = async () => {
    if (!input.files.length) return;
    const fd = new FormData();
    fd.append('file', input.files[0]);
    try {
      await api('/api/providers/' + p.uuid + '/upload', {method: 'POST', body: fd});
      showError('上传成功');
      load();
    } catch (err) {
      showError('上传失败: ' + err.message);
    }
  };
  input.click();
}

load();
</script>
</body>
</html>
