<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>sbctl - 模板管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #f5f5f5; color: #333; line-height: 1.5; height: 100vh; display: flex; flex-direction: column; }
  nav { background: #fff; border-bottom: 1px solid #ddd; padding: 0.6rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
  nav .brand { font-weight: 700; color: #007bff; margin-right: 1rem; }
  nav a { color: #555; text-decoration: none; padding: 0.3rem 0.2rem; }
  nav a.active { color: #007bff; border-bottom: 2px solid #007bff; }
  main { flex: 1; display: flex; overflow: hidden; }
  aside { width: 260px; border-right: 1px solid #ddd; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
  aside h2 { font-size: 0.9rem; margin: 0 0 0.5rem; color: #666; }
  .tpl-item { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; border-radius: 4px; cursor: pointer; }
  .tpl-item:hover { background: #f0f0f0; }
  .tpl-item.active { background: #e3f2fd; }
  .tpl-item .del { color: #c00; cursor: pointer; border: none; background: none; font-size: 0.9rem; }
  .tpl-item .op { color: #06c; cursor: pointer; border: none; background: none; font-size: 0.8rem; margin-right: 0.3rem; }
  #editor-wrap { flex: 1; display: flex; flex-direction: column; padding: 1rem; }
  .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
  .toolbar button { padding: 0.35rem 0.8rem; cursor: pointer; }
  #editor { flex: 1; border: 1px solid #ddd; border-radius: 4px; }
  .error { color: #c00; margin-left: 0.5rem; white-space: pre-wrap; }
  .ok { color: #080; margin-left: 0.5rem; }
</style>
</head>
<body>
<nav>
  <span class="brand">sbctl</span>
  <a href="/">Provider 管理</a>
  <a href="/templates" class="active">模板管理</a>
  <a href="/url">生成 URL</a>
</nav>
<main>
  <aside>
    <h2>模板列表</h2>
    <button id="new-tpl">+ 新建模板</button>
    <div id="tpl-list"></div>
  </aside>
  <div id="editor-wrap">
    <div class="toolbar">
      <span id="cur-name" style="font-weight:bold"></span>
      <button id="save">保存</button>
      <button id="format">格式化</button>
      <span class="ok" id="ok"></span>
      <span class="error" id="error"></span>
    </div>
    <div id="editor"></div>
  </div>
</main>

<script src="/static/ace.js"></script>
<script src="/static/mode-json.js"></script>
<script src="/static/theme-one_dark.js"></script>
<script>
const editor = ace.edit('editor');
editor.session.setMode('ace/mode/json');
editor.setTheme('ace/theme/one_dark');
editor.setOptions({
  showPrintMargin: false,
  tabSize: 2,
  useSoftTabs: true,
  fontSize: 13,
});

const errorBox = $('error');
const okBox = $('ok');
function $(id) { return document.getElementById(id); }
function showError(msg) { errorBox.textContent = msg || ''; okBox.textContent = ''; }
function showOk(msg) { okBox.textContent = msg || ''; errorBox.textContent = ''; }

async function api(url, options) {
  const resp = await fetch(url, options);
  const text = await resp.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!resp.ok) {
    throw new Error(data && data.error ? data.error : ('HTTP ' + resp.status));
  }
  return data;
}

let currentUuid = null;

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function loadList() {
  const infos = await api('/api/templates');
  const list = $('tpl-list');
  list.innerHTML = '';
  for (const t of infos) {
    const div = document.createElement('div');
    div.className = 'tpl-item' + (t.uuid === currentUuid ? ' active' : '');
    div.innerHTML = `<span>${t.default ? '★ ' : ''}${escapeHtml(t.name)}</span>`;
    const btnGroup = document.createElement('span');
    if (!t.default) {
      const setDef = document.createElement('button');
      setDef.className = 'op';
      setDef.textContent = '设默认';
      setDef.onclick = async (e) => {
        e.stopPropagation();
        try {
          await api('/api/templates/' + t.uuid + '/default', {method: 'POST'});
          await loadList();
        } catch (err) { showError('设置失败: ' + err.message); }
      };
      btnGroup.appendChild(setDef);
    }
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = t.default ? '默认模板不可删除' : '删除';
    del.onclick = async (e) => {
      e.stopPropagation();
      if (t.default) { showError('默认模板不可删除'); return; }
      if (!confirm('删除模板 ' + t.name + '？')) return;
      try {
        await api('/api/templates/' + t.uuid, {method: 'DELETE'});
        if (currentUuid === t.uuid) { currentUuid = null; editor.setValue(''); $('cur-name').textContent = ''; }
        await loadList();
      } catch (err) { showError('删除失败: ' + err.message); }
    };
    btnGroup.appendChild(del);
    div.appendChild(btnGroup);
    div.onclick = () => openTemplate(t.uuid);
    list.appendChild(div);
  }
}

async function openTemplate(uuid) {
  try {
    const data = await api('/api/templates/' + uuid);
    const infos = await api('/api/templates');
    const info = infos.find(t => t.uuid === uuid);
    currentUuid = uuid;
    $('cur-name').textContent = (info ? info.name : uuid) + (info && info.default ? '（默认）' : '');
    editor.setValue(JSON.stringify(data, null, 2), -1);
    await loadList();
    showError('');
  } catch (err) { showError('加载失败: ' + err.message); }
}

$('new-tpl').onclick = async () => {
  const name = prompt('输入模板名称');
  if (!name) return;
  try {
    const created = await api('/api/templates?name=' + encodeURIComponent(name), {method: 'POST'});
    await openTemplate(created.uuid);
  } catch (err) { showError('新建失败: ' + err.message); }
};

$('save').onclick = async () => {
  if (!currentUuid) { showError('请先选择模板'); return; }
  try {
    JSON.parse(editor.getValue());
    await api('/api/templates/' + currentUuid, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: editor.getValue(),
    });
    showOk('已保存');
  } catch (err) { showError('保存失败: ' + err.message); }
};

$('format').onclick = () => {
  try {
    editor.setValue(JSON.stringify(JSON.parse(editor.getValue()), null, 2), -1);
    showOk('已格式化');
  } catch (err) { showError('格式化失败（JSON 不合法）: ' + err.message); }
};

loadList();
</script>
</body>
</html>
