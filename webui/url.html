<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>sbctl - 生成配置 URL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #f5f5f5; color: #333; line-height: 1.5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  nav { background: #fff; border-bottom: 1px solid #ddd; padding: 0.6rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
  nav .brand { font-weight: 700; color: #007bff; margin-right: 1rem; }
  nav a { color: #555; text-decoration: none; padding: 0.3rem 0.2rem; }
  nav a.active { color: #007bff; border-bottom: 2px solid #007bff; }
  main { flex: 1; display: flex; overflow: hidden; }
  aside { width: 260px; border-right: 1px solid #ddd; background: #fff; padding: 1rem; overflow-y: auto; }
  aside h2 { font-size: 0.95rem; margin-bottom: 0.8rem; color: #666; }
  aside .field { display: flex; flex-direction: column; margin-bottom: 0.8rem; }
  aside label { font-size: 0.85rem; margin-bottom: 4px; color: #555; }
  aside select, aside input { padding: 0.45rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
  aside button { padding: 0.5rem 0.9rem; border: none; border-radius: 6px; background: #6c757d; color: #fff; cursor: pointer; width: 100%; }
  .content { flex: 1; padding: 1.2rem; overflow-y: auto; }
  .content h1 { font-size: 1.2rem; margin-bottom: 1rem; }
  .section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .section h2 { font-size: 0.95rem; margin-bottom: 0.8rem; color: #666; }
  .field { display: flex; flex-direction: column; margin-bottom: 0.8rem; }
  .field-title { font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
  .check-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .check-row input[type="checkbox"] { width: 17px; height: 17px; }
  select, input[type="text"], input[type="number"] { padding: 0.45rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
  .sub-fields { border-left: 3px solid #e0e0e0; padding-left: 12px; margin-top: 4px; }
  .sub-fields .field { margin-bottom: 0.6rem; }
  button { padding: 0.5rem 0.9rem; font-size: 0.9rem; border: none; border-radius: 6px; cursor: pointer; margin: 4px 8px 4px 0; }
  #copyBtn { background: #28a745; color: #fff; }
  #openBtn { background: #007bff; color: #fff; }
  #url-box { width: 100%; margin-top: 10px; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 0.85rem; background: #fafafa; word-break: break-all; }
  .error { color: #c00; margin-top: 6px; font-size: 0.9rem; }
</style>
</head>
<body>
<nav>
  <span class="brand">sbctl</span>
  <a href="/">Provider 管理</a>
  <a href="/templates">模板管理</a>
  <a href="/url" class="active">生成 URL</a>
</nav>

<main>
  <aside>
    <h2>从 URL 导入</h2>
    <div class="field">
      <input type="text" id="import-url" placeholder="粘贴已有 URL">
      <button id="importBtn" style="margin-top:6px">导入</button>
    </div>

    <h2 style="margin-top:1rem">选择</h2>
    <div class="field">
      <label>Provider</label>
      <select id="provider"></select>
    </div>
    <div class="field">
      <label>模板</label>
      <select id="template"></select>
    </div>
  </aside>

  <div class="content">
    <h1>生成配置 URL</h1>

    <div class="section">
      <h2>Platform</h2>
      <select id="platform">
        <option value="windows">Windows</option>
        <option value="linux">Linux</option>
        <option value="android">Android</option>
      </select>
    </div>

    <div class="section">
      <h2>Tun 模式</h2>
      <div class="check-row">
        <input type="checkbox" id="tun"><label for="tun">启用 Tun</label>
      </div>
    </div>

    <div class="section">
      <h2>Mixed 模式</h2>
      <div class="check-row">
        <input type="checkbox" id="mixed"><label for="mixed">启用 Mixed</label>
      </div>
      <div class="sub-fields" id="mixed-sub" style="display:none">
        <div class="field">
          <div class="field-title">Mixed 端口</div>
          <input type="number" id="mixed-port" placeholder="7899">
        </div>
        <div class="check-row">
          <input type="checkbox" id="sys-proxy"><label for="sys-proxy">系统代理</label>
        </div>
        <div class="check-row">
          <input type="checkbox" id="share"><label for="share">局域网共享</label>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Web UI（clash_api，默认禁用）</h2>
      <div class="check-row">
        <input type="checkbox" id="enable-webui"><label for="enable-webui">启用 Web UI</label>
      </div>
      <div class="sub-fields" id="webui-sub" style="display:none">
        <div class="field">
          <div class="field-title">端口</div>
          <input type="number" id="webui-port" placeholder="9090">
        </div>
        <div class="field">
          <div class="field-title">Secret（可选）</div>
          <input type="text" id="webui-secret" placeholder="留空则不设置">
        </div>
      </div>
    </div>

    <button id="copyBtn">复制 URL</button>
    <button id="openBtn">打开</button>
    <div class="error" id="error"></div>
    <input id="url-box" type="text" readonly value="请选择 provider">
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const errorBox = $('error');

async function api(url) {
  const resp = await fetch(url);
  const text = await resp.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!resp.ok) throw new Error(data && data.error ? data.error : ('HTTP ' + resp.status));
  return data;
}

function showError(msg) { errorBox.textContent = msg || ''; }

async function loadSelects() {
  try {
    const [providers, templates] = await Promise.all([
      api('/api/providers'),
      api('/api/templates'),
    ]);
    const pSel = $('provider');
    pSel.innerHTML = '<option value="">-- 选择 provider --</option>';
    for (const p of providers) {
      const opt = document.createElement('option');
      opt.value = p.uuid;
      opt.textContent = p.name;
      pSel.appendChild(opt);
    }
    const tSel = $('template');
    tSel.innerHTML = '';
    for (const name of templates) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      tSel.appendChild(opt);
    }
  } catch (e) {
    showError('加载数据失败: ' + e.message);
  }
}

$('mixed').onchange = () => {
  $('mixed-sub').style.display = $('mixed').checked ? '' : 'none';
};
$('enable-webui').onchange = () => {
  $('webui-sub').style.display = $('enable-webui').checked ? '' : 'none';
};

function buildUrl() {
  const uuid = $('provider').value;
  if (!uuid) return '';
  const params = [];
  const template = $('template').value;
  if (template) params.push('template=' + encodeURIComponent(template));
  const platform = $('platform').value;
  if (platform) params.push('platform=' + platform);
  if ($('tun').checked) params.push('tun');
  if ($('mixed').checked) {
    params.push('mixed');
    if ($('mixed-port').value) params.push('mixed-port=' + $('mixed-port').value);
    if ($('sys-proxy').checked) params.push('sys-proxy');
    if ($('share').checked) params.push('share');
  }
  if ($('enable-webui').checked) {
    if ($('webui-port').value) params.push('webui-port=' + $('webui-port').value);
    if ($('webui-secret').value) params.push('webui-secret=' + encodeURIComponent($('webui-secret').value));
  }
  return location.origin + '/config/' + uuid + (params.length ? '?' + params.join('&') : '');
}

function updateUrl() {
  const url = buildUrl();
  $('url-box').value = url || '请选择 provider';
  showError('');
}

function importFromUrl(url) {
  try {
    const u = new URL(url, location.origin);
    const m = u.pathname.match(/\/config\/([^/]+)/);
    if (m) $('provider').value = m[1];
    const q = u.searchParams;
    if (q.has('template')) $('template').value = q.get('template');
    if (q.has('platform')) $('platform').value = q.get('platform');
    $('tun').checked = q.has('tun');
    $('mixed').checked = q.has('mixed');
    $('mixed-port').value = q.get('mixed-port') || '';
    $('sys-proxy').checked = q.has('sys-proxy');
    $('share').checked = q.has('share');
    $('enable-webui').checked = q.has('webui-port') || q.has('webui-secret');
    $('webui-port').value = q.get('webui-port') || '';
    $('webui-secret').value = q.get('webui-secret') || '';
    $('mixed-sub').style.display = $('mixed').checked ? '' : 'none';
    $('webui-sub').style.display = $('enable-webui').checked ? '' : 'none';
    updateUrl();
  } catch (e) {
    showError('导入失败: ' + e.message);
  }
}

$('importBtn').onclick = () => {
  const url = $('import-url').value.trim();
  if (!url) { showError('请输入 URL'); return; }
  importFromUrl(url);
};

document.querySelectorAll('select, input').forEach((el) => {
  if (el.id === 'import-url') return;
  el.addEventListener('change', updateUrl);
  el.addEventListener('input', updateUrl);
});

$('copyBtn').onclick = async () => {
  const url = $('url-box').value;
  if (!url || url.startsWith('请选择')) { showError('请先选择 provider'); return; }
  try {
    await navigator.clipboard.writeText(url);
    alert('URL 已复制');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('URL 已复制');
  }
};

$('openBtn').onclick = () => {
  const url = $('url-box').value;
  if (!url || url.startsWith('请选择')) { showError('请先选择 provider'); return; }
  window.open(url, '_blank');
};

loadSelects();
</script>
</body>
</html>
